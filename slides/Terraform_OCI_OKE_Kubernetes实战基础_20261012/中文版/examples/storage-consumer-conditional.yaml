apiVersion: v1
kind: Pod
metadata:
  name: volume-reader
  namespace: oke-cloud-examples
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: database-pvc
