apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: standalone-entry
  namespace: oke-cloud-examples
spec:
  ingressClassName: REPLACE_WITH_EXISTING_CLASS
  rules:
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: standalone-web
                port:
                  number: 80
