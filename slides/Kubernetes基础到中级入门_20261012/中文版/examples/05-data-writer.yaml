apiVersion: v1
kind: Pod
metadata:
  name: data-writer
  namespace: k8s-learn
spec:
  containers:
    - name: writer
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
