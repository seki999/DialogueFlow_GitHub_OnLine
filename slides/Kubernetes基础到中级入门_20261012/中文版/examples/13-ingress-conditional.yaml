apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-entry
  namespace: k8s-learn
spec:
  ingressClassName: learn-class
  rules:
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
